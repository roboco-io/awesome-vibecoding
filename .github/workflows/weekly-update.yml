name: Weekly README Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to update'
        type: choice
        options: [all, code, apps, context, quality, delivery, operations, learning]
        default: all
      force_refresh:
        description: 'Ignore the seven-day Exa search cache'
        type: boolean
        default: false

concurrency:
  group: readme-update
  cancel-in-progress: false
  queue: max

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Pi update
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'kimi' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_TURNS: ${{ vars.AI_MAX_TURNS }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CATEGORY: ${{ inputs.category || 'all' }}
          FORCE_REFRESH: ${{ inputs.force_refresh || 'false' }}
        run: node scripts/weekly-update.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md README.ja.md .cache/awesome-vibecoding.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Weekly README update via Pi"
            git pull --rebase
            git push
          fi
