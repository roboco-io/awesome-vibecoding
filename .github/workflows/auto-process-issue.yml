name: Auto Process Issue

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: readme-update
  cancel-in-progress: false
  queue: max

jobs:
  validate-and-process:
    # Run when a human opens an issue that either already carries the
    # 'addition' label or contains a URL in its body, or when a human applies
    # the 'addition' label later. We deliberately do NOT rely on
    # auto-label-addition.yml to "unblock" us by adding the label: that
    # workflow uses the default GITHUB_TOKEN, and label events created by
    # GITHUB_TOKEN do not trigger further workflow runs, so the 'labeled'
    # branch would never fire for bot-added labels. Detecting the URL directly
    # on 'opened' removes that broken handoff. The bot-actor guard also
    # prevents re-runs when this workflow adds its own status labels
    # (invalid/duplicate/rejected/needs-review).
    if: >-
      !endsWith(github.actor, '[bot]') && (
        (github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'addition') || contains(github.event.issue.body, 'http'))) ||
        (github.event.action == 'labeled' && github.event.label.name == 'addition')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate URL
        id: validate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Reject abnormally large bodies before any further processing.
          # Body is passed via env var so that backticks or $() in the issue
          # text cannot be evaluated by the shell.
          BODY_LEN=${#ISSUE_BODY}
          if [ "$BODY_LEN" -gt 5000 ]; then
            echo "status=too_long" >> $GITHUB_OUTPUT
            echo "body_len=$BODY_LEN" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract URL from issue body.
          URL=$(printf '%s' "$ISSUE_BODY" | grep -oPi 'https?://[^\s)>]+' | head -1 || true)

          if [ -z "$URL" ]; then
            echo "status=no_url" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "url=$URL" >> $GITHUB_OUTPUT

          # Check if URL is reachable
          CURL_FAILED=false
          HTTP_CODE=$(curl --globoff --proto =http,https --proto-redir =http,https -o /dev/null -s -w "%{http_code}" -L --max-time 10 "$URL") || CURL_FAILED=true
          HTTP_CODE=${HTTP_CODE:-000}
          if [ "$CURL_FAILED" = true ] || [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "408" ] || [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
            echo "status=needs_review" >> $GITHUB_OUTPUT
            echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "status=unreachable" >> $GITHUB_OUTPUT
            echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for duplicates in README
          if grep -qF "$URL" README.md; then
            echo "status=duplicate" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "status=valid" >> $GITHUB_OUTPUT

      - name: Reject - Body too long
        if: steps.validate.outputs.status == 'too_long'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Rejected**: Issue body is ${{ steps.validate.outputs.body_len }} characters, exceeding the 5000-character limit. Please open a new issue with a concise description (URL plus a one-paragraph summary).`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['invalid']
            });

      - name: Reject - No URL
        if: steps.validate.outputs.status == 'no_url'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ **Rejected**: No valid URL found in this issue. Please include a URL (https://...) for the resource.\n\nPlease create a new issue using the [Add Resource template](https://github.com/roboco-io/awesome-vibecoding/issues/new?template=add-resource.yml).'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['invalid']
            });

      - name: Request review - URL temporarily inaccessible
        if: steps.validate.outputs.status == 'needs_review'
        uses: actions/github-script@v9
        env:
          RESOURCE_URL: ${{ steps.validate.outputs.url }}
          HTTP_CODE: ${{ steps.validate.outputs.http_code }}
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number, labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `The public evidence at ${process.env.RESOURCE_URL} could not be verified (HTTP ${process.env.HTTP_CODE}). This may be temporary or an automated-access restriction, so the issue remains open for review.`
            });

      - name: Reject - Unreachable URL
        if: steps.validate.outputs.status == 'unreachable'
        uses: actions/github-script@v9
        env:
          RESOURCE_URL: ${{ steps.validate.outputs.url }}
          HTTP_CODE: ${{ steps.validate.outputs.http_code }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Rejected**: The URL \`${process.env.RESOURCE_URL}\` is not reachable (HTTP ${process.env.HTTP_CODE}). Please verify the URL and create a new issue.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['invalid']
            });

      - name: Reject - Duplicate
        if: steps.validate.outputs.status == 'duplicate'
        uses: actions/github-script@v9
        env:
          RESOURCE_URL: ${{ steps.validate.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ℹ️ **Already listed**: The URL \`${process.env.RESOURCE_URL}\` is already in the README. If you want to update the description, please mention that in a new issue.\n\nClosing as duplicate.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['duplicate']
            });

      - name: Setup Node.js
        if: steps.validate.outputs.status == 'valid'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.validate.outputs.status == 'valid'
        run: npm ci --ignore-scripts

      - name: Process with Pi
        if: steps.validate.outputs.status == 'valid'
        id: pi
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'kimi' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_TURNS: ${{ vars.AI_MAX_TURNS }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ISSUE_URL: ${{ steps.validate.outputs.url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/auto-process-issue.mjs

      - name: Reject - Quality check failed
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'rejected'
        uses: actions/github-script@v9
        env:
          REASON: ${{ steps.pi.outputs.reason }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Rejected**: ${process.env.REASON}\n\nIf you believe this is incorrect, please comment with additional context and a maintainer will review.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['rejected']
            });

      - name: Request maintainer review - Uncertain
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'uncertain'
        uses: actions/github-script@v9
        env:
          REASON: ${{ steps.pi.outputs.reason }}
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤔 **Needs maintainer review**: ${process.env.REASON}\n\n@serithemage Could you take a look? Use \`/approve\` to add or \`/reject [reason]\` to decline.`
            });

      - name: Commit and push
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'processed'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git add README.md README.ko.md README.ja.md
            git commit -m "docs: Add resource from issue #${{ github.event.issue.number }}

          Closes #${{ github.event.issue.number }}
          Generated by Pi via GitHub Actions"
            git pull --rebase
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Comment on issue
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'processed' && steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '✅ **Added!** The resource has been added to the README with Korean and Japanese translations. Thank you for your contribution!'
            });

      - name: Close issue
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'processed' && steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });

      - name: Request review if no changes
        if: steps.validate.outputs.status == 'valid' && steps.pi.outputs.result == 'processed' && steps.commit.outputs.has_changes == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Needs manual review**: The automated system could not make changes.\n\n@serithemage Could you take a look? Use `/approve` to add or `/reject [reason]` to decline.'
            });
      - name: Request review after failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.issue.number, labels: ['needs-review']
            });
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: 'Pi automation failed. No success was recorded. A maintainer can inspect the Actions run and retry or use `/approve`.'
            });
