name: Issue Manual Review Handler

on:
  issue_comment:
    types: [created]

concurrency:
  group: readme-update
  cancel-in-progress: false
  queue: max

jobs:
  handle-approve:
    # /approve - Force add a resource that auto-processing couldn't handle
    if: |
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'serithemage' &&
      github.event.comment.body == '/approve'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      - name: Acknowledge approval
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Manual approval received. Processing...'
            });

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Process Issue with Pi
        id: pi
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MAX_TURNS: ${{ vars.AI_MAX_TURNS }}
          AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS }}
          AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue-approval.mjs

      - name: Commit and push changes
        if: steps.pi.outputs.result == 'processed'
        id: commit
        env:
          PLACEMENT: ${{ steps.pi.outputs.placement }}
          REPLACED: ${{ steps.pi.outputs.replaced }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$REPLACED" = "true" ]; then SUBJECT="Replace resource"
          elif [ "$PLACEMENT" = "extended" ]; then SUBJECT="Add extended resource"
          else SUBJECT="Add resource"; fi
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git add README.md README.ko.md README.ja.md docs/verified-catalog.md docs/catalog-history.md data/catalog-status.json
            git commit -m "docs: $SUBJECT from issue #${{ github.event.issue.number }} (manual approve)

          Closes #${{ github.event.issue.number }}
          Generated by Pi via GitHub Actions"
            git pull --rebase
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Close issue on success
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        env:
          COMMENT_FILE: ${{ steps.pi.outputs.comment_file }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync(process.env.COMMENT_FILE, 'utf8')
            });
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.issue.number, name: 'needs-review' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Post review result
        if: steps.pi.outputs.result == 'rejected' || steps.pi.outputs.result == 'uncertain'
        uses: actions/github-script@v9
        env:
          COMMENT_FILE: ${{ steps.pi.outputs.comment_file }}
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: fs.readFileSync(process.env.COMMENT_FILE, 'utf8')
            });

      - name: Comment on failure
        if: failure() || (steps.pi.outputs.result != 'processed' && steps.pi.outputs.result != 'rejected' && steps.pi.outputs.result != 'uncertain') || steps.commit.outputs.has_changes == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ No changes were made. Pi did not complete a verified update. Check the Actions run before retrying.'
            });

  handle-reject:
    # /reject - Close issue with reason
    if: |
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'serithemage' &&
      (github.event.comment.body == '/reject' || startsWith(github.event.comment.body, '/reject '))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write

    steps:
      - name: Reject and close
        uses: actions/github-script@v9
        with:
          script: |
            const comment = context.payload.comment.body;
            const reason = comment.replace('/reject', '').trim() || 'Does not meet curation criteria.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Rejected by maintainer**: ${reason}\n\nThank you for your suggestion!`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
